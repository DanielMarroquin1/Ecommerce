services:
  - type: web
    name: ecommerce-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: NODE_ENV
        value: qa
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: QA_WHITELIST_IP
        value: "127.0.0.1,::1,::ffff:127.0.0.1,74.220.48.,74.220.56."
      - key: FRONTEND_URL
        value: https://ecommerce-frontend-qa.netlify.app

  - type: web
    name: ecommerce-frontend-qa
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ecommerce-na6d.onrender.com/api
